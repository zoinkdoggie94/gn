<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta name="theme-color" content="#07110b">

    <title>GN-Shrub</title>

    <meta
        name="title"
        content="GN-Shrub"
    >

    <meta
        name="description"
        content="Play browser games on GN-Shrub. Fast, clean, and easy to use."
    >

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://zoinkdoggie94.github.io/gn/">
    <meta property="og:title" content="GN-Shrub">

    <meta
        property="og:description"
        content="Play browser games on GN-Shrub. Fast, clean, and easy to use."
    >

    <meta name="twitter:card" content="summary">
    <meta name="twitter:url" content="https://zoinkdoggie94.github.io/gn/">
    <meta name="twitter:title" content="GN-Shrub">

    <meta
        name="twitter:description"
        content="Play browser games on GN-Shrub. Fast, clean, and easy to use."
    >

    <link
        rel="icon"
        type="image/png"
        href="favicon.png"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="favicon.png"
    >

    <link
        rel="apple-touch-icon"
        href="favicon.png"
    >

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>

<body class="dark-mode">
    <header>
        <div class="header-content">

            <a
                class="logo"
                href="./"
                aria-label="GN-Shrub home"
            >
                <span class="logo-main">GN</span><span class="logo-accent">-Shrub</span>
            </a>

            <div class="search-container">

                <label class="sr-only" for="searchBar">
                    Search games
                </label>

                <input
                    type="search"
                    id="searchBar"
                    placeholder="Search zones..."
                    autocomplete="off"
                    spellcheck="false"
                    oninput="filterZones()"
                >

                <label class="sr-only" for="sortOptions">
                    Sort games
                </label>

                <select
                    id="sortOptions"
                    onchange="sortZones()"
                >
                    <option value="name">
                        Name
                    </option>

                    <option value="id">
                        ID (Date)
                    </option>

                    <option value="popular">
                        Popular
                    </option>
                </select>

                <label class="sr-only" for="filterOptions">
                    Filter by tag
                </label>

                <select
                    id="filterOptions"
                    onchange="filterZones2()"
                >
                    <option value="none">
                        Tag
                    </option>
                </select>

            </div>

            <div class="control-buttons">

                <button
                    id="refresh"
                    class="control-button"
                    type="button"
                    title="Refresh zones"
                    aria-label="Refresh zones"
                    onclick="listZones()"
                >
                    <img
                        src="refresh-icon.png"
                        alt=""
                        draggable="false"
                    >
                </button>

                <button
                    id="settings"
                    class="control-button"
                    type="button"
                    title="Settings"
                    aria-label="Settings"
                >
                    <img
                        src="setting.png"
                        alt=""
                        draggable="false"
                    >
                </button>

            </div>

        </div>
    </header>

    <main>

        <div id="loadStatus" role="status" aria-live="polite">
            Loading zones...
        </div>

        <details
            id="featuredZonesWrapper"
            open
        >
            <summary id="allZonesSummary">
                Featured Zones
            </summary>

            <div
                id="featuredZones"
                class="zone-container"
            ></div>
        </details>

        <div class="section-divider"></div>

        <details
            id="allZonesWrapper"
            open
        >
            <summary id="allSummary">
                All Zones
            </summary>

            <div id="container">
                <div class="loading-message">
                    Loading...
                </div>
            </div>
        </details>

    </main>

    <div
        id="zoneViewer"
        hidden
        aria-hidden="true"
    >
        <div class="zone-header">

            <div class="zone-title">
                <h2 id="zoneName">
                    Zone
                </h2>

                <span
                    id="zoneId"
                    hidden
                ></span>

                <a
                    id="zoneAuthor"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    by Author
                </a>
            </div>

            <div class="zone-controls">

                <button
                    type="button"
                    onclick="fullscreenZone()"
                >
                    Fullscreen
                </button>

                <button
                    type="button"
                    onclick="aboutBlank()"
                >
                    New Tab
                </button>

                <button
                    type="button"
                    onclick="downloadZone()"
                >
                    Download
                </button>

                <button
                    type="button"
                    class="zone-close-button"
                    onclick="closeZone()"
                >
                    Close
                </button>

            </div>

        </div>

        <iframe
            id="zoneFrame"
            title="GN-Shrub game"
            allow="autoplay; fullscreen; gamepad; pointer-lock"
            allowfullscreen
        ></iframe>
    </div>

    <div
        id="popupOverlay"
        aria-hidden="true"
    >
        <div
            class="popup"
            role="dialog"
            aria-modal="true"
            aria-labelledby="popupTitle"
        >

            <div class="popup-header">

                <h3 id="popupTitle">
                    Settings
                </h3>

                <button
                    id="popupClose"
                    type="button"
                    onclick="closePopup()"
                    aria-label="Close popup"
                >
                    ×
                </button>

            </div>

            <div id="popupBody">
                Content will be here.
            </div>

        </div>
    </div>

    <div
        id="toast"
        role="status"
        aria-live="polite"
    ></div>

    <footer>
        <div class="footer-links">

            <a
                href="#"
                onclick="loadDMCA(); return false;"
            >
                DMCA
            </a>

            <a
                href="#"
                onclick="showContact(); return false;"
            >
                Contact
            </a>

            <a
                href="#"
                onclick="loadPrivacy(); return false;"
            >
                Privacy
            </a>

            <a
                href="#"
                onclick="saveData(); return false;"
            >
                Export Data
            </a>

            <a
                href="#"
                onclick="document.getElementById('importData').click(); return false;"
            >
                Import Data
            </a>

            <input
                type="file"
                id="importData"
                accept=".json,application/json"
                hidden
                onchange="loadData(event)"
            >

        </div>

        <div class="footer-brand">
            GN-Shrub
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
